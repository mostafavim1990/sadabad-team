name: Update Farhangian snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel reader
        run: python -m pip install --upgrade pip openpyxl
      - name: Extract workbook data
        run: python scripts/update_farhangian.py
      - name: Save snapshot to repository
        run: |
          if git diff --quiet -- report/farhangian/data.json; then
            echo "No data changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add report/farhangian/data.json
            git commit -m "Update Excel data snapshot"
            git push
          fi
