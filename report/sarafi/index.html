<style>
:root{--g:#0f8f70;--gd:#066b55;--ink:#17252a;--mut:#667a80;--line:#e2eae8;--bg:#f2f6f5;--card:#fff;--cur:#d9f3e7;--nxt:#fddde9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"B Nazanin","B Nazanin Regular","BNazanin",Tahoma,sans-serif;font-size:13px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.locked{overflow:hidden}body.locked #app{display:none}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top img{width:44px;height:44px;border-radius:11px;box-shadow:0 2px 8px #0f8f7044}
.brand{font-size:11px;color:var(--g);font-weight:700;letter-spacing:.2px}
h1{margin:0;font-size:19px;line-height:1.2}
.card{background:var(--card);border-radius:14px;padding:11px 13px;box-shadow:0 1px 4px #0a2a2212}
.power{background:linear-gradient(135deg,#17b48c,#066b55);color:#fff;text-align:center;padding:14px 12px;border-radius:16px;box-shadow:0 4px 14px #066b5544}
.power small{display:block;font-size:12px;opacity:.9}.power b{display:block;font-size:26px;line-height:1.3;margin-top:2px;font-weight:800}.power span{font-size:12px;opacity:.9}
.upd{margin:8px 2px 10px;font-size:11.5px;color:var(--mut)}.upd b{color:var(--ink)}
.stats{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin:0 0 10px}
.stats table{width:100%;border-collapse:collapse;font-size:11.5px;color:var(--mut)}
.stats td{padding:5px 10px;border-top:1px solid var(--line);font-weight:400}
.stats tr:first-child td{border-top:0}
.stats td:last-child{text-align:left;direction:rtl;color:var(--mut);font-weight:400;white-space:nowrap}

.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input[type=search],select,.gate input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#667a80 50%),linear-gradient(135deg,#667a80 50%,transparent 50%);background-position:14px 52%,9px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-left:26px}
input:focus,select:focus{border-color:var(--g)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin:2px 2px 8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-left:5px;border:1px solid #0001}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:9px 13px}
.sum span{color:var(--mut);font-size:12px}.sum b{font-size:16px;color:var(--gd)}
.tw{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px #0a2a2212}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#e9f1ef;color:#42565b;font-weight:700;text-align:right;padding:8px 6px;font-size:11.5px}
.tw table{border-collapse:separate;border-spacing:0 6px;padding:0 5px}
.tw tbody tr td{padding:10px 7px;vertical-align:middle;overflow-wrap:anywhere;border-top:1px solid #0000000b;border-bottom:1px solid #0000000b}
.tw tbody tr td:first-child{border-radius:0 10px 10px 0;border-right:1px solid #0000000b}
.tw tbody tr td:last-child{border-radius:10px 0 0 10px;border-left:1px solid #0000000b;white-space:nowrap}
td.n{white-space:nowrap;font-weight:700}
tr.cur td{background:var(--cur)}tr.nxt td{background:var(--nxt)}tr.past td{background:#e5e7eb;color:#687078} .tw tbody tr:not(.cur):not(.nxt):not(.past) td{background:#fff}
.tw tbody tr{cursor:pointer}.tw tbody tr:active td{filter:brightness(.96)}
#dm{position:fixed;inset:0;z-index:8;background:#0b2f2799;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
#dm.show{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .22s;box-shadow:0 -8px 30px #0003}
#dm.show .sheet{transform:none}
@media(min-width:700px){#dm{align-items:center}.sheet{border-radius:20px;max-width:440px}}
.grab{width:42px;height:5px;border-radius:3px;background:#d4dedb;margin:4px auto 10px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h3{margin:0;font-size:17px;line-height:1.4}.dh small{color:var(--mut);font-size:12px}
.x{border:0;background:#eef3f2;color:var(--mut);width:32px;height:32px;border-radius:50%;flex:none;font:inherit;font-size:20px;line-height:1}
.badge{display:inline-block;margin:10px 0 4px;padding:3px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:#e5e7eb;color:#555}
.badge.ok{background:#d9f3e7;color:#066b55}.badge.spent{background:#e3e9fb;color:#2f4ea3}.badge.wait{background:#fff1cf;color:#8a5a00}.badge.bad{background:#fde0e0;color:#b02323}
.dl{margin:8px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px}
.dl div:first-child{border-top:0}.dl dt{color:var(--mut);margin:0;flex:none}.dl dd{margin:0;font-weight:700;text-align:left}
.pos{color:#0a8a5f}.neg{color:#d33}
.note{margin-top:10px;background:#f6f9f8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{display:block;color:var(--mut);margin-bottom:3px;font-size:12px}
.empty{padding:22px;text-align:center;color:var(--mut)}
#gate{position:fixed;inset:0;z-index:9;background:#0b2f27bb;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px}
#gate.hide{display:none}
.gate{background:#fff;border-radius:20px;padding:24px 20px 18px;width:100%;max-width:330px;text-align:center;box-shadow:0 14px 40px #0006}
.gate img{width:64px;height:64px;border-radius:16px;box-shadow:0 3px 10px #0f8f7055}
.gate h2{margin:8px 0 2px;font-size:20px}.gate p{margin:0 0 14px;color:var(--mut);font-size:13px}
.gate input{text-align:center;letter-spacing:4px;direction:ltr}
.gate.bad input{border-color:#d33}
.gate button{width:100%;margin-top:10px;font:inherit;font-size:16px;font-weight:700;padding:11px;border:0;border-radius:11px;background:var(--g);color:#fff}
#msg{min-height:20px;margin-top:8px;color:#d33;font-size:13px;font-weight:700}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}.gate.shake{animation:sh .35s}
</style>
</head>

const sgn=n=>(n<0?"−":"")+fmt(Math.abs(n));
const tone=n=>n>0?"pos":n<0?"neg":"";
function badge(s){return /(باطل|برگشت)/.test(s)?"bad":/خرج/.test(s)?"spent":/پاس|وصول/.test(s)?"ok":/سررسید نشده/.test(s)?"wait":""}
function openDetail(i){
 const c=window.DATA.checks[i];if(!c)return;
 const pct=(c.percent||0)*100,pt=(Math.round(pct*100)/100).toString().replace(".","٫");
 const st=c.state||"—";
 $("ds").innerHTML=`<div class="grab"></div>
 <div class="dh"><div><h3>${esc(c.owner)}</h3><small>سررسید: ${esc(c.due)}</small></div><button class="x" id="dx" aria-label="بستن">×</button></div>
 <span class="badge ${badge(st)}">${esc(st)}</span>
 <dl class="dl">
 <div><dt>مبلغ چک</dt><dd>${fmt(c.amount)} تومان</dd></div>
 <div><dt>مبلغ خرید</dt><dd>${fmt(c.buyAmount||0)} تومان</dd></div>
 <div><dt>سود</dt><dd class="${tone(c.profit)}" dir="ltr">${sgn(c.profit||0)} تومان</dd></div>
 <div><dt>درصد سود</dt><dd class="${tone(pct)}" dir="ltr">${PD(pt)}٪</dd></div>
 <div><dt>انتقال گیرنده</dt><dd>${esc((c.receiver||"").trim())}</dd></div>
 <div><dt>خریده شده از</dt><dd>${esc(c.from)}</dd></div>
 </dl>
 <div class="note"><small>توضیحات چک</small>${esc(c.note)}</div>`;
 $("dm").classList.add("show");$("dm").setAttribute("aria-hidden","false");$("ds").scrollTop=0;
}
function closeDetail(){$("dm").classList.remove("show");$("dm").setAttribute("aria-hidden","true")}
$("tb").addEventListener("click",e=>{const r=e.target.closest("tr[data-i]");if(r)openDetail(+r.dataset.i)});
$("tb").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest("tr[data-i]");if(r)openDetail(+r.dataset.i)}});
$("dm").addEventListener("click",e=>{if(e.target===$("dm")||e.target.id==="dx")closeDetail()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});
function init(){const D=window.DATA;$("power").textContent=fmt(D.buyingPower||0);
  $("totalBuy").textContent=fmt(D.totalBuy??0)+" تومان";
  $("totalPaid").textContent=fmt(D.totalPaid??0)+" تومان";
  $("netProfit").textContent=fmt(D.netProfit??0)+" تومان";
  $("marketCapital").textContent=D.marketCapital==null?"—":fmt(D.marketCapital)+" تومان";
 if(D.updatedAt){const d=new Date(D.updatedAt);if(!isNaN(d)){const j=toJ(d.getFullYear(),d.getMonth()+1,d.getDate());$("upd").textContent=PD(j[2])+" "+MN[j[1]-1]+" "+PD(j[0])}}
 render()}
function unlock(){document.body.classList.remove("locked");$("gate").classList.add("hide");init()}
$("q").addEventListener("input",render);$("mode").addEventListener("change",render);
$("gp").addEventListener("input",()=>{$("msg").textContent="";$("gf").classList.remove("bad")});
$("gf").addEventListener("submit",e=>{e.preventDefault();const v=LD($("gp").value).trim();
 if(sha256(v)===HASH){unlock()}
 else{$("msg").textContent="رمز ورود صحیح نمی‌باشد";const g=$("gf");g.classList.add("bad");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");$("gp").select()}});
setTimeout(()=>$("gp").focus(),150);
</script>
</body></html>
