<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FD3A4"/>
      <stop offset="0.55" stop-color="#0FA37F"/>
      <stop offset="1" stop-color="#066B55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F5EA"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B88F"/>
      <stop offset="1" stop-color="#07785F"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A7C61"/>
      <stop offset="1" stop-color="#054B3A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#033D2F" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#033D2F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- leaf -->
  <path filter="url(#shadow)" fill="url(#leaf)"
        d="M810 196 C560 200 330 270 235 470 C150 650 230 835 420 850 C640 868 790 690 830 460 C850 350 835 260 810 196 Z"/>
  <!-- leaf midrib -->
  <path d="M790 250 C640 430 470 520 300 585" fill="none" stroke="#0FA37F" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"/>

  <!-- cheque -->
  <g transform="translate(470 640) rotate(-10)" filter="url(#soft)">
    <rect x="-215" y="-100" width="430" height="200" rx="30" fill="url(#check)"/>
    <rect x="-215" y="-100" width="430" height="200" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
    <line x1="-155" y1="-38" x2="40" y2="-38" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    <line x1="-155" y1="22" x2="40" y2="22" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-opacity="0.9"/>
    <rect x="95" y="2" width="85" height="46" rx="12" fill="#fff" fill-opacity="0.95"/>
  </g>

  <!-- pen -->
  <g transform="translate(655 470) rotate(32)" filter="url(#soft)">
    <path d="M-30 -210 Q-30 -240 0 -240 Q30 -240 30 -210 L30 70 L0 150 L-30 70 Z"
          fill="url(#pen)" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
    <rect x="-30" y="-150" width="60" height="16" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="-17" y="-200" width="9" height="230" rx="4.5" fill="#ffffff" fill-opacity="0.35"/>
    <path d="M-13 100 L0 150 L13 100 Z" fill="#fff"/>
    <!-- clip -->
    <rect x="34" y="-215" width="16" height="130" rx="8" fill="#0A7C61" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
