<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1917">
<title>حسابداری شرکا</title>
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf9;--ink:#1c1917;--muted:#6b645c;--line:#e7e0d6;
  --davood:#1d4ed8;--mohammad:#0f766e;--omid:#b45309;
  --pay:#166534;--take:#9f1239;--shadow:0 10px 30px #1c191708;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.7}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 56px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{color:var(--muted);font-size:13px}
h1{margin:0;font-size:clamp(26px,4vw,34px)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.claims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.claim{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:var(--shadow);border-top:4px solid var(--line)}
.claim.davood{border-top-color:var(--davood)}
.claim.mohammad{border-top-color:var(--mohammad)}
.claim.omid{border-top-color:var(--omid)}
.claim .who{color:var(--muted);font-size:14px}
.claim .num{font-size:clamp(20px,3vw,28px);font-weight:800;margin-top:4px}
.claim .unit{color:var(--muted);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.months{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.month{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.month.active{background:#1c1917;color:#fff;border-color:#1c1917}
.month small{color:#a8a29e}
.month.active small{color:#d6d3d1}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;cursor:pointer}
.chip.on{background:#1c1917;color:#fff;border-color:#1c1917}
.layout{display:grid;grid-template-columns:1fr 280px;gap:14px;margin-top:14px;align-items:start}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid #f0ebe3;text-align:right;vertical-align:top}
th{position:sticky;top:0;background:#faf7f2;font-size:13px}
tr.pay td.amount{color:var(--pay)}
tr.take td.amount{color:var(--take)}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;background:#f5f5f4}
.badge.pay{background:#dcfce7;color:#166534}
.badge.take{background:#ffe4e6;color:#9f1239}
.person{font-weight:700}
.person.داود{color:var(--davood)}
.person.محمد{color:var(--mohammad)}
.person.امید{color:var(--omid)}
.desc{max-width:420px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.side h2{margin:0 0 8px;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f0ebe3;font-size:14px}
.kv b{font-weight:700;white-space:nowrap}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.status{color:var(--muted);font-size:13px;margin-top:8px}
.error{background:#fff1f2;color:#9f1239;padding:10px 12px;border-radius:10px}
.hidden{display:none!important}
@media(max-width:860px){
  .claims,.layout{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <div class="eyebrow">دفتر مشترک سه شریک</div>
      <h1 id="title">حسابداری شرکا</h1>
      <p class="sub" id="subtitle">طلب هر شریک، و ریز پرداخت و برداشت هر ماه</p>
    </div>
    <button class="btn" id="reload">بارگذاری مجدد</button>
  </header>
  <div id="error" class="error hidden"></div>
  <section class="claims" id="claims"></section>
  <section class="panel">
    <div class="months" id="months"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="جستجو در شرح تراکنش…">
      <div class="chips" id="people"></div>
      <div class="chips" id="types"></div>
    </div>
    <p class="status" id="status">در حال خواندن…</p>
  </section>
  <section class="layout">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>تاریخ</th><th>شرح</th><th>مبلغ</th><th>نوع</th><th>شریک</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <aside class="panel side" id="side"></aside>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = n => typeof n === "number" && Number.isFinite(n)
  ? new Intl.NumberFormat("fa-IR").format(n) : "—";
function safe(v){
  const amp = "&" + "amp;";
  const lt = "&" + "lt;";
  const gt = "&" + "gt;";
  const quot = "&" + "quot;";
  const apos = "&" + "#39;";
  return String(v ?? "")
    .replaceAll("&", amp)
    .replaceAll("<", lt)
    .replaceAll(">", gt)
    .replaceAll('"', quot)
    .replaceAll("'", apos);
}

let data = null, month = 0, person = "همه", kind = "همه";
const PEOPLE = ["همه", "داود", "محمد", "امید"];
const KINDS = ["همه", "پرداخت", "برداشت"];

function txOf(sheet){
  const header = sheet.headerRow;
  return (sheet.rows || []).filter(r => header && r.rowNumber > header).map(r => {
    const c = r.cells || [];
    const amount = typeof c[2] === "number" ? c[2] : null;
    const hasTx = c[0] || c[1] || amount || c[3] || c[4];
    return hasTx ? {
      date: c[0] || "",
      desc: c[1] || "",
      amount,
      type: c[3] || "",
      person: c[4] || "",
    } : null;
  }).filter(Boolean);
}

function notesOf(sheet){
  const header = sheet.headerRow;
  const out = [];
  for (const r of sheet.rows || []) {
    if (header && r.rowNumber <= header) continue;
    const c = r.cells || [];
    const label = c[8];
    const value = c[9];
    if (label && value !== undefined && value !== null && value !== "") {
      out.push({label: String(label), value});
    } else if (label && !value) {
      out.push({label: String(label), value: null});
    }
  }
  return out;
}

function shortTitle(title){
  return String(title || "").replace(/^تراز مالی شرکت\s*-\s*/, "").trim() || "ماه";
}

function renderClaims(){
  const c = data.chart || {};
  const items = [
    ["davood", "طلب داود", c.davood],
    ["mohammad", "طلب محمد", c.mohammad],
    ["omid", "طلب امید", c.omid],
  ];
  $("claims").innerHTML = items.map(([k, name, n]) =>
    `<article class="claim ${k}"><div class="who">${name}</div><div class="num">${fmt(n)}</div><div class="unit">تومان، آخرین عدد داخل اکسل</div></article>`
  ).join("");
}

function renderMonths(){
  $("months").innerHTML = data.sheets.map((s, i) => {
    const n = txOf(s).length;
    return `<button class="month ${i===month?"active":""}" data-i="${i}">${safe(shortTitle(s.title))}<br><small>${fmt(n)} تراکنش</small></button>`;
  }).join("");
  $("months").querySelectorAll("button").forEach(b => b.onclick = () => {
    month = Number(b.dataset.i);
    renderMonths();
    renderTable();
  });
}

function renderFilters(){
  $("people").innerHTML = PEOPLE.map(p => `<button class="chip ${p===person?"on":""}" data-p="${p}">${p}</button>`).join("");
  $("types").innerHTML = KINDS.map(p => `<button class="chip ${p===kind?"on":""}" data-k="${p}">${p}</button>`).join("");
  $("people").querySelectorAll("button").forEach(b => b.onclick = () => { person = b.dataset.p; renderFilters(); renderTable(); });
  $("types").querySelectorAll("button").forEach(b => b.onclick = () => { kind = b.dataset.k; renderFilters(); renderTable(); });
}

function renderTable(){
  const sheet = data.sheets[month];
  const q = $("q").value.trim();
  let rows = txOf(sheet);
  if (person !== "همه") rows = rows.filter(r => r.person === person);
  if (kind !== "همه") rows = rows.filter(r => r.type === kind);
  if (q) rows = rows.filter(r => `${r.desc} ${r.date} ${r.person}`.includes(q));

  $("rows").innerHTML = rows.length ? rows.map(r => {
    const cls = r.type === "برداشت" ? "take" : r.type === "پرداخت" ? "pay" : "";
    return `<tr class="${cls}">
      <td>${safe(r.date)}</td>
      <td class="desc">${safe(r.desc)}</td>
      <td class="amount">${fmt(r.amount)}</td>
      <td><span class="badge ${cls}">${safe(r.type || "—")}</span></td>
      <td class="person ${safe(r.person)}">${safe(r.person || "—")}</td>
    </tr>`;
  }).join("") : `<tr><td class="empty" colspan="5">برای این ماه تراکنشی با این فیلتر نیست.</td></tr>`;

  const notes = notesOf(sheet);
  $("side").innerHTML = `<h2>خلاصه همین ماه</h2>` + (notes.length
    ? notes.map(n => `<div class="kv"><span>${safe(n.label)}</span><b>${n.value===null ? "" : (typeof n.value==="number" ? fmt(n.value) : safe(n.value))}</b></div>`).join("")
    : `<p class="empty">خلاصه‌ای در این شیت نیست.</p>`)
    + `<p class="note">${fmt(rows.length)} ردیف در جدول. پرداخت یعنی شریک از حساب خودش به نفع شرکت خرج کرده؛ برداشت یعنی از حساب شرکت به حساب شریک وارد شده.</p>`;

  $("status").textContent = shortTitle(sheet.title);
}

async function load(){
  $("reload").disabled = true;
  $("error").classList.add("hidden");
  try {
    const res = await fetch("./data.json?ts=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("data.json پیدا نشد");
    data = await res.json();
    $("title").textContent = data.project || "حسابداری شرکا";
    const withTx = data.sheets.map((s,i)=>({i,n:txOf(s).length})).filter(x=>x.n>0);
    month = withTx.length ? withTx[withTx.length-1].i : 0;
    renderClaims();
    renderMonths();
    renderFilters();
    renderTable();
  } catch (e) {
    $("error").textContent = "خطا: " + e.message;
    $("error").classList.remove("hidden");
    $("status").textContent = "بارگذاری ناموفق بود.";
  } finally {
    $("reload").disabled = false;
  }
}
$("reload").onclick = load;
$("q").oninput = () => data && renderTable();
load();
</script>
</body>
</html>
