<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>تراز مالی شراکت</title>
<style>
/* فونت وزیرمتن (Vazirmatn): ابتدا از پوشه fonts کنار همین فایل، اگر نبود از CDN */
@font-face{font-family:"Vazirmatn";font-weight:100 900;font-style:normal;font-display:swap;
  src:url("fonts/Vazirmatn[wght].woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2") format("woff2")}
:root{
  --bg:#f4f1ea;--card:#fffdf9;--ink:#1c1917;--muted:#6b645c;--line:#e7e0d6;
  --davood:#1d4ed8;--mohammad:#0f766e;--omid:#b45309;
  /* رنگ‌های دقیق همان فایل اکسل برای نوع عملیات */
  --pay-bg:#C2D69B;--take-bg:#FF7C80;--pay-ink:#3f5217;--take-ink:#8c1d22;
  --shadow:0 10px 30px #1c191708;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn","B Nazanin","BNazanin",Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.8}
body.noscroll{overflow:hidden}
.wrap{max-width:1180px;margin:auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom))}
button,select,input{font:inherit}

/* نوار تاریخ بروزرسانی */
.updated{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:10px}
.updated .dot{width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;margin-inline-end:6px;box-shadow:0 0 0 3px #16a34a22}

header{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:14px}
.eyebrow{color:var(--muted);font-size:13px}
h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1.4}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.55;cursor:wait}

.claims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.claim{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);border-top:4px solid var(--line)}
.claim.davood{border-top-color:var(--davood)}
.claim.mohammad{border-top-color:var(--mohammad)}
.claim.omid{border-top-color:var(--omid)}
.claim .who{color:var(--muted);font-size:13px}
.claim .num{font-size:clamp(14px,4.2vw,26px);font-weight:800;margin-top:2px;line-height:1.5;white-space:nowrap}
.claim .unit{color:var(--muted);font-size:11px}
.claim .unit .long{display:none}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.months{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.month{border:1px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;cursor:pointer;white-space:nowrap;line-height:1.5;flex:0 0 auto}
.month.active{background:#1c1917;color:#fff;border-color:#1c1917}
.month small{color:#8a837b}
.month.active small{color:#d6d3d1}
.tools{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tools input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;flex:0 0 auto}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
.chip.on{background:#1c1917;color:#fff;border-color:#1c1917}
.sep{width:1px;background:var(--line);flex:0 0 1px;margin:4px 2px}
.status{color:var(--muted);font-size:12px;margin:8px 0 0}
.error{background:#fff1f2;color:#9f1239;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.hidden{display:none!important}

/* فهرست تراکنش‌ها: در موبایل کارت فشرده، در دسکتاپ جدول */
.layout{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px;align-items:start}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list-head{display:none}
.tx{display:grid;grid-template-columns:1fr auto;grid-template-areas:"amount type" "meta meta";align-items:center;gap:0 10px;
  padding:9px 12px 9px 10px;border-bottom:1px solid #f0ebe3;border-inline-start:5px solid var(--line);cursor:pointer;outline:none;transition:background .15s}
.tx:last-child{border-bottom:0}
.tx.pay{border-inline-start-color:var(--pay-bg)}
.tx.take{border-inline-start-color:var(--take-bg)}
.tx:active,.tx:hover,.tx:focus-visible{background:#faf7f2}
.tx .c-amount{grid-area:amount;font-weight:700;font-size:16px;line-height:1.6}
.tx.pay .c-amount{color:var(--pay-ink)}
.tx.take .c-amount{color:var(--take-ink)}
.tx .c-amount small{font-weight:400;color:var(--muted);font-size:11px;margin-inline-start:4px}
.tx .c-type{grid-area:type;justify-self:end}
.tx .c-date,.tx .c-person{font-size:12.5px;color:var(--muted)}
.tx .c-meta{grid-area:meta;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;line-height:1.6}
.tx .c-date{grid-area:auto}
.tx .c-chev{display:none}
.badge{display:inline-block;border-radius:999px;padding:0 10px;font-size:12px;line-height:1.7;background:#f5f5f4;color:#57534e}
.badge.pay{background:var(--pay-bg);color:var(--pay-ink)}
.badge.take{background:var(--take-bg);color:var(--take-ink)}
.person{font-weight:700}
.person.داود{color:var(--davood)}
.person.محمد{color:var(--mohammad)}
.person.امید{color:var(--omid)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:8px 2px 0}

.side{margin-top:0}
.side summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.side summary::-webkit-details-marker{display:none}
.side summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.side[open] summary::after{transform:rotate(180deg)}
.side .body{margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f0ebe3;font-size:14px}
.kv b{font-weight:700;white-space:nowrap}
.note{color:var(--muted);font-size:12px;margin:10px 0 0}

/* پنجره جزئیات: در موبایل از پایین باز می‌شود، در دسکتاپ وسط صفحه */
#sheet{position:fixed;inset:0;z-index:5000;display:flex;align-items:flex-end;justify-content:center;background:#0c0a0980;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#sheet.open{opacity:1;visibility:visible}
.sheet-box{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #00000040;transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
#sheet.open .sheet-box{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:#d6d0c6;margin:4px auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet-top h3{margin:0;font-size:16px}
.x{border:0;background:#f0ebe3;width:36px;height:36px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer}
.d-desc{white-space:pre-wrap;word-break:break-word;font-size:16.5px;line-height:2;background:#faf7f2;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0 14px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.d-item.full{grid-column:1/-1}
.d-item span{display:block;color:var(--muted);font-size:12px}
.d-item b{font-size:15.5px}
.d-item .badge{font-size:14px;padding:1px 14px}
.d-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
.d-nav .btn{flex:1}
.d-nav .pos{color:var(--muted);font-size:12px;flex:0 0 auto}

/* قفل ورود */
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 15%,#2563eb55,transparent 45%),radial-gradient(circle at 85% 85%,#0f766e55,transparent 45%),linear-gradient(135deg,#0f0d0c,#1c1917 55%,#292524);backdrop-filter:blur(6px);transition:opacity .45s ease,visibility .45s}
#gate.hide{opacity:0;visibility:hidden;pointer-events:none}
.gate-box{width:100%;max-width:400px;background:#fffdf9ee;border:1px solid #ffffff55;border-radius:24px;padding:34px 28px 28px;text-align:center;box-shadow:0 30px 70px #00000066;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.gate-icon{width:72px;height:72px;margin:-70px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1d4ed8,#0f766e);box-shadow:0 12px 28px #1d4ed855;border:4px solid #fff}
.gate-icon svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gate-box h2{margin:0 0 4px;font-size:22px;color:var(--ink)}
.gate-box p{margin:0 0 20px;color:var(--muted);font-size:14px}
.gate-field{position:relative;margin-bottom:10px}
.gate-field input{width:100%;font:inherit;font-size:17px;text-align:center;letter-spacing:2px;direction:ltr;border:2px solid var(--line);border-radius:13px;padding:12px 44px;background:#faf7f2;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.gate-field input:focus{border-color:#1d4ed8;box-shadow:0 0 0 4px #1d4ed822}
.gate-field.bad input{border-color:#dc2626;box-shadow:0 0 0 4px #dc262622}
.gate-eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:19px;padding:4px;line-height:1;opacity:.6}
.gate-eye:hover{opacity:1}
.gate-msg{min-height:26px;color:#b91c1c;font-weight:bold;font-size:15px;margin-bottom:8px}
.gate-box .btn{width:100%;padding:12px;font-size:17px;font-weight:bold;border:0;color:#fff;background:linear-gradient(135deg,#1d4ed8,#1e40af)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
body.locked .wrap{display:none}

/* تبلت و دسکتاپ */
@media(min-width:760px){
  body{font-size:16px}
  .wrap{padding:20px 20px 56px}
  .claims{gap:14px}
  .claim{padding:16px 18px 14px;border-radius:16px}
  .claim .num{font-size:clamp(22px,2.6vw,28px)}
  .claim .unit .short{display:none}.claim .unit .long{display:inline}
  .panel{padding:16px;border-radius:16px}
  .tools{flex-direction:row;align-items:center}
  .tools input{flex:1;min-width:200px;width:auto}
  .layout{grid-template-columns:1fr 290px;gap:14px;margin-top:14px}
  .list{border-radius:12px}
  .list-head,.tx{display:grid;grid-template-columns:130px minmax(150px,1fr) 120px 110px 24px;grid-template-areas:none;gap:0 12px;align-items:center}
  .list-head{padding:8px 15px 8px 12px;background:#faf7f2;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:#57534e}
  .tx{padding:10px 10px 10px 12px}
  .tx .c-date{grid-column:1;grid-row:1;font-size:14px;color:var(--ink)}
  .tx .c-amount{grid-column:2;grid-row:1;font-size:15px}
  .tx .c-type{grid-column:3;grid-row:1;justify-self:start}
  .tx .c-meta{display:contents}
  .tx .c-person{grid-column:4;grid-row:1;font-size:14px}
  .tx .c-chev{display:block;grid-column:5;grid-row:1;color:#b8b0a4;font-size:18px;text-align:left}
  .tx .c-amount small{display:none}
  .side summary{pointer-events:none}.side summary::after{display:none}
  #sheet{align-items:center}
  .sheet-box{border-radius:22px;max-height:84vh;padding-top:18px}
  .grab{display:none}
}
@media(max-width:350px){.claims{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="locked">
<div id="gate"><form class="gate-box" id="gateForm" autocomplete="off">
<div class="gate-icon"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
<h2>ورود به تراز مالی شراکت</h2><p>برای مشاهده گزارش، لطفاً رمز عبور را وارد کنید.</p>
<div class="gate-field" id="gateField"><input type="password" id="gatePass" placeholder="رمز عبور" autofocus autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" class="gate-eye" id="gateEye" aria-label="نمایش رمز">👁</button></div>
<div class="gate-msg" id="gateMsg" role="alert"></div>
<button class="btn" type="submit">ورود</button></form></div>

<main class="wrap">
  <div class="updated" id="updated"></div>
  <header>
    <div>
      <div class="eyebrow">تراز مالی شراکت</div>
      <h1 id="title">حسابداری شرکا</h1>
      <p class="sub" id="subtitle">طلب هر شریک، و ریز پرداخت و برداشت هر ماه</p>
    </div>
    <button class="btn" id="reload">بارگذاری مجدد</button>
  </header>
  <div id="error" class="error hidden"></div>
  <section class="claims" id="claims"></section>
  <section class="panel">
    <div class="months" id="months"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="جستجو در شرح، تاریخ یا نام…" enterkeyhint="search">
      <div class="chiprow"><div class="chips" id="people"></div><div class="sep"></div><div class="chips" id="types"></div></div>
    </div>
    <p class="status" id="status">در حال خواندن…</p>
  </section>
  <section class="layout">
    <div>
      <div class="list" id="list">
        <div class="list-head"><span>تاریخ</span><span>مبلغ (تومان)</span><span>نوع</span><span>شریک</span><span></span></div>
        <div id="rows"></div>
      </div>
      <p class="hint">برای دیدن شرح و جزئیات هر تراکنش، روی آن بزنید.</p>
    </div>
    <details class="panel side" id="side"></details>
  </section>
</main>

<div id="sheet" aria-hidden="true">
  <div class="sheet-box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetBox"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("fa-IR");
const fmt = n => typeof n === "number" && Number.isFinite(n) ? nf.format(n) : "—";
const FA = d => String(d).replace(/\d/g, x => "۰۱۲۳۴۵۶۷۸۹"[x]);
function safe(v){
  const amp = "&" + "amp;";
  const lt = "&" + "lt;";
  const gt = "&" + "gt;";
  const quot = "&" + "quot;";
  const apos = "&" + "#39;";
  return String(v ?? "")
    .replaceAll("&", amp)
    .replaceAll("<", lt)
    .replaceAll(">", gt)
    .replaceAll('"', quot)
    .replaceAll("'", apos);
}

const MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
/* تاریخ‌های اکسل چند قالب دارند (1405-03-01 ، 1405/03/01 ، 01/03/1405)؛ همه را یکدست می‌کنیم */
function parseDate(s){
  const t = String(s || "").trim().replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
  let m = t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (m) return {y:+m[1], m:+m[2], d:+m[3]};
  m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
  if (m) return {y:+m[3], m:+m[2], d:+m[1]};
  return null;
}
function shortDate(s){
  const p = parseDate(s);
  return p ? FA(`${p.y}/${String(p.m).padStart(2,"0")}/${String(p.d).padStart(2,"0")}`) : (s || "—");
}
function longDate(s){
  const p = parseDate(s);
  return p && MONTHS[p.m-1] ? FA(`${p.d} ${MONTHS[p.m-1]} ${p.y}`) : (s || "—");
}
function stamp(iso){
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  try {
    return new Intl.DateTimeFormat("fa-IR-u-ca-persian", {dateStyle:"long", timeStyle:"short", timeZone:"Asia/Tehran"}).format(d);
  } catch (_) { return d.toLocaleString("fa-IR"); }
}

let data = null, month = 0, person = "همه", kind = "همه", shown = [], cur = -1;
const PEOPLE = ["همه", "داود", "محمد", "امید"];
const KINDS = ["همه", "پرداخت", "برداشت"];
const clsOf = t => t === "برداشت" ? "take" : t === "پرداخت" ? "pay" : "";

function txOf(sheet){
  const header = sheet.headerRow;
  return (sheet.rows || []).filter(r => header && r.rowNumber > header).map(r => {
    const c = r.cells || [];
    const amount = typeof c[2] === "number" ? c[2] : null;
    const hasTx = c[0] || c[1] || amount || c[3] || c[4];
    return hasTx ? {
      date: c[0] || "",
      desc: String(c[1] || "").trim(),
      amount,
      type: c[3] || "",
      person: c[4] || "",
    } : null;
  }).filter(Boolean);
}

function notesOf(sheet){
  const header = sheet.headerRow;
  const out = [];
  for (const r of sheet.rows || []) {
    if (header && r.rowNumber <= header) continue;
    const c = r.cells || [];
    const label = c[8];
    const value = c[9];
    if (label && value !== undefined && value !== null && value !== "") {
      out.push({label: String(label), value});
    } else if (label && !value) {
      out.push({label: String(label), value: null});
    }
  }
  return out;
}

function shortTitle(title){
  return String(title || "").replace(/^تراز مالی شرکت\s*-\s*/, "").trim() || "ماه";
}

function renderUpdated(){
  const a = stamp(data.generatedAt), b = stamp(data.sourceModifiedAt);
  $("updated").innerHTML = (a ? `<span><i class="dot"></i>آخرین بروزرسانی از اکسل: ${safe(a)}</span>` : "")
    + (b ? `<span>آخرین ذخیره فایل اکسل: ${safe(b)}</span>` : "");
}

function renderClaims(){
  const c = data.chart || {};
  const items = [
    ["davood", "طلب داود", c.davood],
    ["mohammad", "طلب محمد", c.mohammad],
    ["omid", "طلب امید", c.omid],
  ];
  $("claims").innerHTML = items.map(([k, name, n]) =>
    `<article class="claim ${k}"><div class="who">${name}</div><div class="num">${fmt(n)}</div><div class="unit"><span class="short">تومان</span><span class="long">تومان، آخرین عدد داخل اکسل</span></div></article>`
  ).join("");
}

function renderMonths(){
  $("months").innerHTML = data.sheets.map((s, i) => {
    const n = txOf(s).length;
    return `<button class="month ${i===month?"active":""}" data-i="${i}">${safe(shortTitle(s.title))}<br><small>${fmt(n)} تراکنش</small></button>`;
  }).join("");
  $("months").querySelectorAll("button").forEach(b => b.onclick = () => {
    month = Number(b.dataset.i);
    renderMonths();
    renderTable();
  });
  const act = $("months").querySelector(".active");
  if (act) act.scrollIntoView({inline:"center", block:"nearest"});
}

function renderFilters(){
  $("people").innerHTML = PEOPLE.map(p => `<button class="chip ${p===person?"on":""}" data-p="${p}">${p}</button>`).join("");
  $("types").innerHTML = KINDS.map(p => `<button class="chip ${p===kind?"on":""}" data-k="${p}">${p}</button>`).join("");
  $("people").querySelectorAll("button").forEach(b => b.onclick = () => { person = b.dataset.p; renderFilters(); renderTable(); });
  $("types").querySelectorAll("button").forEach(b => b.onclick = () => { kind = b.dataset.k; renderFilters(); renderTable(); });
}

function renderTable(){
  const sheet = data.sheets[month];
  const q = $("q").value.trim();
  let rows = txOf(sheet);
  if (person !== "همه") rows = rows.filter(r => r.person === person);
  if (kind !== "همه") rows = rows.filter(r => r.type === kind);
  if (q) rows = rows.filter(r => `${r.desc} ${r.date} ${shortDate(r.date)} ${r.person}`.includes(q));
  shown = rows;

  $("rows").innerHTML = rows.length ? rows.map((r, i) => {
    const cls = clsOf(r.type);
    return `<div class="tx ${cls}" role="button" tabindex="0" data-i="${i}" aria-label="جزئیات تراکنش">
      <div class="c-amount">${fmt(r.amount)}<small>تومان</small></div>
      <div class="c-type"><span class="badge ${cls}">${safe(r.type || "—")}</span></div>
      <div class="c-meta"><span class="c-date">${safe(shortDate(r.date))}</span><span class="c-person"><span class="person ${safe(r.person)}">${safe(r.person || "—")}</span></span></div>
      <div class="c-chev">‹</div>
    </div>`;
  }).join("") : `<div class="empty">برای این ماه تراکنشی با این فیلتر نیست.</div>`;

  const notes = notesOf(sheet);
  const wasOpen = $("side").open;
  $("side").innerHTML = `<summary>خلاصه همین ماه</summary><div class="body">` + (notes.length
    ? notes.map(n => `<div class="kv"><span>${safe(n.label)}</span><b>${n.value===null ? "" : (typeof n.value==="number" ? fmt(n.value) : safe(n.value))}</b></div>`).join("")
    : `<p class="empty">خلاصه‌ای در این شیت نیست.</p>`)
    + `<p class="note">${fmt(rows.length)} ردیف در جدول. پرداخت یعنی شریک از حساب خودش به نفع شرکت خرج کرده؛ برداشت یعنی از حساب شرکت به حساب شریک وارد شده.</p></div>`;
  if (wide.matches) $("side").open = true; else $("side").open = wasOpen && !firstRender;
  firstRender = false;

  $("status").textContent = shortTitle(sheet.title) + " — " + fmt(rows.length) + " تراکنش";
}
const wide = window.matchMedia("(min-width:760px)");
let firstRender = true;
wide.addEventListener?.("change", () => { if (data) $("side").open = wide.matches; });

/* پنجره جزئیات */
function showDetail(i){
  const r = shown[i];
  if (!r) return;
  cur = i;
  const cls = clsOf(r.type);
  $("sheetBox").innerHTML = `
    <div class="grab"></div>
    <div class="sheet-top"><h3 id="sheetTitle">جزئیات تراکنش</h3><button class="x" id="sheetClose" aria-label="بستن">✕</button></div>
    <div class="d-desc">${r.desc ? safe(r.desc) : "<span style='color:var(--muted)'>شرحی ثبت نشده است.</span>"}</div>
    <div class="d-grid">
      <div class="d-item"><span>نوع عملیات</span><b><span class="badge ${cls}">${safe(r.type || "—")}</span></b></div>
      <div class="d-item"><span>تاریخ تراکنش</span><b>${safe(longDate(r.date))}</b></div>
      <div class="d-item"><span>مبلغ</span><b>${fmt(r.amount)} <small style="font-weight:400;color:var(--muted)">تومان</small></b></div>
      <div class="d-item"><span>نام شخص</span><b class="person ${safe(r.person)}">${safe(r.person || "—")}</b></div>
    </div>
    <div class="d-nav">
      <button class="btn" id="dPrev" ${i<=0?"disabled":""}>› قبلی</button>
      <span class="pos">${fmt(i+1)} از ${fmt(shown.length)}</span>
      <button class="btn" id="dNext" ${i>=shown.length-1?"disabled":""}>بعدی ‹</button>
    </div>`;
  $("sheetClose").onclick = closeDetail;
  $("dPrev").onclick = () => showDetail(cur - 1);
  $("dNext").onclick = () => showDetail(cur + 1);
  $("sheetBox").scrollTop = 0;
}
function openDetail(i){
  const wasOpen = $("sheet").classList.contains("open");
  showDetail(i);
  $("sheet").classList.add("open");
  $("sheet").setAttribute("aria-hidden", "false");
  document.body.classList.add("noscroll");
  if (!wasOpen) { try { history.pushState({sheet:1}, ""); } catch (_) {} }
  $("sheetClose").focus({preventScroll:true});
}
function closeDetail(fromPop){
  if (!$("sheet").classList.contains("open")) return;
  $("sheet").classList.remove("open");
  $("sheet").setAttribute("aria-hidden", "true");
  document.body.classList.remove("noscroll");
  if (fromPop !== true && history.state && history.state.sheet) { try { history.back(); } catch (_) {} }
}
window.addEventListener("popstate", () => closeDetail(true));
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeDetail(); });
document.addEventListener("keydown", e => {
  if (!$("sheet").classList.contains("open")) return;
  if (e.key === "Escape") closeDetail();
  else if (e.key === "ArrowRight" && cur > 0) showDetail(cur - 1);
  else if (e.key === "ArrowLeft" && cur < shown.length - 1) showDetail(cur + 1);
});
$("rows").addEventListener("click", e => {
  const el = e.target.closest(".tx");
  if (el) openDetail(Number(el.dataset.i));
});
$("rows").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest(".tx");
  if (el) { e.preventDefault(); openDetail(Number(el.dataset.i)); }
});

async function load(){
  $("reload").disabled = true;
  $("error").classList.add("hidden");
  try {
    const res = await fetch("./data.json?ts=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("data.json پیدا نشد");
    data = await res.json();
    $("title").textContent = data.project || "حسابداری شرکا";
    const withTx = data.sheets.map((s,i)=>({i,n:txOf(s).length})).filter(x=>x.n>0);
    month = withTx.length ? withTx[withTx.length-1].i : 0;
    renderUpdated();
    renderClaims();
    renderMonths();
    renderFilters();
    renderTable();
  } catch (e) {
    $("error").textContent = "خطا: " + e.message;
    $("error").classList.remove("hidden");
    $("status").textContent = "بارگذاری ناموفق بود.";
  } finally {
    $("reload").disabled = false;
  }
}
$("reload").onclick = load;
$("q").oninput = () => data && renderTable();

const HASHES=["d6eeee3753896a8e2f787e2aea7c98cb928c470e7cec9521611b554575897212","129109a2e615337868655325a36baf42c85215b67159e0209a588ef500fe37d3","35919aecb68ba703230812729ad27129912fa9b6d63e78897e45e2049b93b612"];
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function unlock(){document.body.classList.remove('locked');$('gate').classList.add('hide');load();}
$('gateEye').addEventListener('click',()=>{const i=$('gatePass');i.type=i.type==='password'?'text':'password';});
$('gatePass').addEventListener('input',()=>{$('gateField').classList.remove('bad');$('gateMsg').textContent='';});
$('gateForm').addEventListener('submit',async e=>{e.preventDefault();const v=$('gatePass').value.trim().toLowerCase();
  if(!(window.crypto&&crypto.subtle)){$('gateMsg').textContent='مرورگر شما از بررسی امن رمز پشتیبانی نمی‌کند.';return;}
  const h=await sha256(v);
  if(HASHES.includes(h)){try{sessionStorage.setItem('dash_ok','1')}catch(_){}unlock();}
  else{$('gateMsg').textContent='رمز ورود اشتباه است.';$('gateField').classList.add('bad');const b=$('gateForm');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('gatePass').select();}
});
let remembered=false;try{remembered=sessionStorage.getItem('dash_ok')==='1'}catch(_){}
if(remembered)unlock();else setTimeout(()=>$('gatePass').focus(),100);
</script>
